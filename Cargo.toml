[package]
name = "c9s"
version = "0.3.0"
edition = "2021"
description = "A k9s-inspired terminal UI for running, switching and watching many Claude Code sessions"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
repository = "https://github.com/waxb/c9s"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
dirs = "6"
libc = "0.2"
ratatui = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "3"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
